name: Release RustDeskHop

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test RustDesk routing and recovery logic
        run: dotnet test tests\RustDeskHop.Tests\RustDeskHop.Tests.csproj --configuration Release

      - name: Publish self-contained Windows build
        run: >-
          dotnet publish RustDeskCompanion.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:PublishSingleFile=true
          --property:IncludeNativeLibrariesForSelfExtract=true
          --property:DebugType=None
          --property:DebugSymbols=false
          --output publish

      - name: Create versioned release files
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $exeName = "RustDeskHop-v$version-win-x64.exe"
          $zipName = "RustDeskHop-v$version-win-x64.zip"
          $sourceName = "RustDeskHop-v$version-source.zip"

          Copy-Item "publish\RustDeskHop.exe" $exeName
          Compress-Archive -Path "publish\*" -DestinationPath $zipName
          git archive --format=zip --prefix="RustDeskHop-v$version/" --output=$sourceName HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create matching source archive.' }

          @($exeName, $zipName, $sourceName, 'LICENSE') | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash
            "$hash  $_"
          } | Set-Content SHA256SUMS.txt

          "RELEASE_EXE=$exeName" >> $env:GITHUB_ENV
          "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV
          "RELEASE_SOURCE=$sourceName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseArgs = @(
            'release', 'create', $tag,
            $env:RELEASE_EXE,
            $env:RELEASE_ZIP,
            $env:RELEASE_SOURCE,
            'LICENSE',
            'SHA256SUMS.txt',
            '--title', "RustDeskHop $tag",
            '--notes', 'RustDeskHop is free and open source under GPL-3.0-only. The matching source code and build instructions are in the versioned source ZIP attached to this release. The Windows ZIP also includes the license and usage guide. RustDesk is installed separately.',
            '--generate-notes'
          )

          if ($tag -match '-') {
            $releaseArgs += '--prerelease'
            $releaseArgs += '--latest=false'
          }
          else {
            $releaseArgs += '--latest'
          }

          gh @releaseArgs
