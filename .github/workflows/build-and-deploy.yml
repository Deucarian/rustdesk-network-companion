name: Build and deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained Windows build
        run: >-
          dotnet publish RustDeskCompanion.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:PublishSingleFile=true
          --property:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Package build
        shell: pwsh
        run: |
          $branch = "${{ github.head_ref || github.ref_name }}"
          $branch = $branch -replace '[^A-Za-z0-9._-]', '-'
          $archive = "rustdesk-network-companion-$branch-${{ github.run_number }}.zip"
          Compress-Archive -Path publish\* -DestinationPath $archive

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-network-companion-${{ github.ref_name }}-${{ github.run_number }}
          path: rustdesk-network-companion-${{ github.ref_name }}-${{ github.run_number }}.zip
          retention-days: 30
